<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Chat Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
    </style>
</head>
<body class="h-screen flex antialiased">
    <!-- Sidebar for file upload -->
    <div class="w-64 bg-gray-900 border-r border-gray-800 flex flex-col p-4">
        <div class="text-xl font-bold mb-6 text-gray-200">RAG App</div>
        <div class="flex-grow">
            <h2 class="text-lg font-semibold mb-2">Upload a PDF</h2>
            <p class="text-sm text-gray-400 mb-4">Upload a document to use as context for your questions.</p>
            <div class="space-y-4">
                <input type="file" id="pdf-file-input" accept=".pdf" class="block w-full text-sm text-gray-400
                    file:mr-4 file:py-2 file:px-4
                    file:rounded-full file:border-0
                    file:text-sm file:font-semibold
                    file:bg-violet-50 file:text-violet-700
                    hover:file:bg-violet-100
                ">
                <button id="upload-btn" class="w-full bg-violet-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg hover:bg-violet-700 transition duration-300">
                    Upload
                </button>
            </div>
            <div id="upload-status" class="mt-4 text-sm font-medium"></div>
        </div>
        <div class="text-xs text-gray-500 mt-auto">
            © 2024 RAG Application
        </div>
    </div>

    <!-- Main chat interface -->
    <div class="flex-1 flex flex-col bg-gray-950">
        <header class="bg-gray-900 p-4 border-b border-gray-800 shadow-md">
            <h1 class="text-xl font-bold text-center">Chat with your documents</h1>
        </header>

        <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4">
            <div class="flex items-start justify-center text-center p-8 bg-gray-800 rounded-lg max-w-lg mx-auto mt-10">
                <p class="text-gray-400">
                    Upload a PDF to the sidebar to get started. You can then ask questions about its content.
                </p>
            </div>
        </div>

        <!-- Chat input form -->
        <div class="p-4 bg-gray-900 border-t border-gray-800">
            <form id="chat-form" class="flex space-x-2">
                <input type="text" id="chat-input" placeholder="Ask a question..."
                    class="flex-1 p-3 bg-gray-800 rounded-lg border border-gray-700 focus:outline-none focus:border-violet-600 text-white">
                <button type="submit" class="bg-violet-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg hover:bg-violet-700 transition duration-300">
                    Send
                </button>
            </form>
        </div>
    </div>

    <script>
        const BASE_URL = "http://localhost:8000/api/v1";

        const uploadFileInput = document.getElementById('pdf-file-input');
        const uploadBtn = document.getElementById('upload-btn');
        const uploadStatusDiv = document.getElementById('upload-status');
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatContainer = document.getElementById('chat-container');

        // Function to create a chat message element
        function createChatMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('flex', 'items-end', 'space-x-2', 'max-w-xl', 'mx-auto');

            const messageTextDiv = document.createElement('div');
            messageTextDiv.classList.add('p-3', 'rounded-lg', 'shadow-md');

            if (sender === 'user') {
                messageDiv.classList.add('justify-end');
                messageTextDiv.classList.add('bg-violet-600', 'text-white', 'rounded-br-none');
            } else { // 'ai'
                messageDiv.classList.add('justify-start');
                messageTextDiv.classList.add('bg-gray-800', 'text-gray-200', 'rounded-bl-none');
            }

            messageTextDiv.innerHTML = text;
            messageDiv.appendChild(messageTextDiv);
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        // Handle PDF upload
        uploadBtn.addEventListener('click', async () => {
            const file = uploadFileInput.files[0];
            if (!file) {
                uploadStatusDiv.innerHTML = '<span class="text-red-500">Please select a file.</span>';
                return;
            }

            uploadStatusDiv.innerHTML = '<span class="text-yellow-500">Uploading and processing...</span>';
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${BASE_URL}/upload-pdf`, {
                    method: 'POST',
                    body: formData,
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                uploadStatusDiv.innerHTML = `<span class="text-green-500">${result.message}</span>`;
            } catch (error) {
                console.error('Upload failed:', error);
                uploadStatusDiv.innerHTML = `<span class="text-red-500">Upload failed: ${error.message}</span>`;
            }
        });

        // Handle chat submission
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = chatInput.value.trim();
            if (!query) return;

            createChatMessage(query, 'user');
            chatInput.value = '';

            try {
                const response = await fetch(`${BASE_URL}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query }),
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();
                createChatMessage(result.response, 'ai');
            } catch (error) {
                console.error('Chat failed:', error);
                createChatMessage('An error occurred. Please try again.', 'ai');
            }
        });
    </script>
</body>
</html>
